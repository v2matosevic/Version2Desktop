[package]
name = "vesper"
version = "0.2.1"
edition = "2024"
rust-version = "1.94"
license-file = "LICENSE"
description = "Offline native video player"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:egui_glow", "dep:rfd", "dep:v2-ui"]

[dependencies]
libloading = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
eframe = { version = "=0.35.0", default-features = false, features = ["glow", "accesskit"], optional = true }
egui_glow = { version = "=0.35.0", optional = true }
rfd = { version = "0.17", default-features = false, optional = true }
v2-ui = { path = "../../shared/v2-ui", optional = true }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true


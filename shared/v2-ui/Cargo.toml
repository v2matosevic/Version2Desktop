[package]
name = "v2-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "Version2 desktop design system: tokens, theme, icons and widgets for the egui apps"

# Consumers pin the same egui/eframe: `eframe = { version = "=0.35.0", default-features = false,
# features = ["glow", "accesskit"] }`. 0.36 needs rustc 1.95; see docs/DESIGN.md.

[dependencies]
egui = { version = "=0.35.0", default-features = false }
eframe = { version = "=0.35.0", default-features = false, features = ["glow", "accesskit"], optional = true }

[target.'cfg(windows)'.dependencies]
# Same major as winit 0.30 already pulls in, so this adds no second copy.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["eframe"]
# `native_options()` and the window icon need eframe; the tokens, theme and widgets do not.
eframe = ["dep:eframe"]

[dev-dependencies]
# Offscreen rendering for the deterministic gallery snapshots only. Never shipped.
egui_kittest = { version = "=0.35.0", features = ["snapshot", "wgpu"] }
